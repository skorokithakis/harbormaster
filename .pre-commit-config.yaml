repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.6.8
  hooks:
    - id: ruff
      args: [ --fix ]
    - id: ruff-format
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.11.2
  hooks:
  - id: mypy
    name: Run type checks
    # apps/ holds demo Compose applications, not project source, and one of them
    # imports flask. This has to be pre-commit's exclude, not mypy's own exclude
    # option: pre-commit passes filenames explicitly, and mypy ignores its own
    # exclude for files named on the command line.
    exclude: '^apps/'
    # This list must track the dependencies in pyproject.toml, as nothing enforces that automatically.
    additional_dependencies:
    - attrs
    - click
    - click-help-colors
    - GitPython
    - pytest
    - ruamel.yaml
    - types-PyYAML
- repo: local
  hooks:
  - id: no-testing
    name: Forbid testing code
    entry: "count - 1\\d+"
    language: pygrep
    types: [python]
- repo: local
  hooks:
  - id: no-todos
    name: Forbid TODOs
    entry: "TODO"
    language: pygrep
    types: [python]
    stages: [manual]
- repo: local
  hooks:
  - id: forbid_prints
    name: Check for leftover print statements.
    types: [python]
    entry: "print\\s*\\("
    language: pygrep
