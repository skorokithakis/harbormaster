name: pre-commit

on:
  pull_request:
  push:
    branches: [master]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        # Keep in sync with the test job.
        python-version: "3.12"
    - uses: pre-commit/action@v3.0.1
      with:
        extra_args: -a --hook-stage manual

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        # 3.12 is chosen, not merely the newest that works. 3.13 cannot install
        # the locked ruamel-yaml-clib 0.2.8 at all: there is no wheel and the C
        # extension does not build. 3.14 does install, but only because
        # ruamel.yaml stops requiring the clib there, and the ruff and mypy
        # versions pinned in .pre-commit-config.yaml predate that interpreter.
        python-version: "3.12"
    - run: pip install poetry
    - run: poetry config virtualenvs.create false
    - run: poetry install --no-root --with dev
    - run: pytest
