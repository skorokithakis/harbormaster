name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        # Keep in sync with the test job.
        python-version: "3.14"
    - uses: pre-commit/action@v3.0.1
      with:
        extra_args: -a --hook-stage manual

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        # 3.14 is the newest interpreter tested successfully with this lock.
        # ruamel.yaml 0.19.1 no longer has a mandatory ruamel-yaml-clib
        # dependency, so the old clib-based cap no longer applies.
        python-version: "3.14"
    - run: pip install poetry
    - run: poetry config virtualenvs.create false
    - run: poetry install --no-root --with dev
    - run: pytest

  # Build-only: catches a broken Dockerfile on PRs and master pushes before
  # release time. Publishing happens in the release workflow.
  docker:
    runs-on: ubuntu-latest
    needs: [test, pre-commit]
    steps:
    - uses: actions/checkout@v7
    - name: Build Docker images
      # Builds misc/Dockerfile tagged :latest first, because
      # misc/Dockerfile.webhook builds FROM stavros/harbormaster:latest.
      run: misc/docker-build.sh
