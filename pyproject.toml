[tool.poetry]
name = "docker-harbormaster"
version = "0.4.0"
description = "A supervisor for docker-compose apps."
authors = ["Stavros Korokithakis <hi@stavros.io>"]
repository = "https://github.com/skorokithakis/harbormaster"
homepage = "https://harbormaster.readthedocs.io/en/latest/"
license = "AGPL-3.0-or-later"
readme = "README.md"

[tool.poetry.scripts]
harbormaster = "docker_harbormaster.cli:cli"

[tool.poetry.dependencies]
python = ">=3.9,<4"
PyYAML = ">=6.0.0"
"ruamel.yaml" = ">=0.17"
click = ">=8.1.3"
attrs = ">=21.2.0"
click-help-colors = ">=0.9.1"

[tool.poetry.dev-dependencies]
pytest = ">=5.2"
GitPython = ">=3.1.18"

[tool.poetry.group.dev.dependencies]
sphinx-rtd-theme = ">=1.2.2"
myst-parser = ">=2.0.0"
linkify-it-py = ">=2.0.2"
sphinxcontrib-mermaid = ">=0.9.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# This must be stated explicitly and kept in step with the floor above. Ruff only
# infers a target from PEP 621 `project.requires-python`, never from Poetry's
# `tool.poetry.dependencies.python`, so without this line the pinned ruff in CI and a
# newer local ruff assume different defaults and reformat the same file differently.
target-version = "py39"
lint.ignore = ["F403", "E501", "N802", "N803", "N806", "C901", "D100", "D102", "D102", "D10"]
